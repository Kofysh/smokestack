name: Fork Go tests

on:
  push:
    branches: [ci-tests]

permissions:
  contents: read

concurrency:
  group: fork-go-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-go-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      - name: Run Go checks
        run: bash scripts/test-go.sh
      - name: Save coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: ignore
